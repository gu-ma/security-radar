name: Monitor advisories and publish dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0,12 * * *"
  push:
    branches: [main]
    paths:
      - "security_radar/**"
      - "tests/**"
      - "config/**"
      - "docs/index.html"
      - "docs/app.js"
      - "docs/styles.css"
      - ".github/workflows/monitor.yml"

concurrency:
  group: security-radar
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Collect public advisories
        if: ${{ github.event_name != 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python -m security_radar
      - name: Generate public RSS and Atom feeds
        if: ${{ github.event_name != 'push' }}
        run: python -m security_radar.feeds
      - name: Persist public state
        if: ${{ github.event_name != 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/rss.xml docs/atom.xml
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public security advisories"
            git push origin HEAD:main
          fi
      - name: Notify Teams if explicitly enabled by the repository owner
        if: ${{ github.event_name != 'push' && vars.ENABLE_TEAMS == 'true' }}
        continue-on-error: true
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RADAR_DASHBOARD_URL: https://apps.massol.me/security-radar/
        run: python -m security_radar.notify
      - name: Package static website
        if: ${{ vars.ENABLE_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: monitor
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
